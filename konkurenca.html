<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Konkurenca — Interzero EPR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css?v21" />
</head>
<body class="bg-stone-50 text-stone-900">
  <div id="app-nav"></div>

  <main class="max-w-5xl mx-auto px-6 py-10">
    <header class="mb-6">
      <h1 class="text-3xl font-bold" data-i18n="page.konkurenca.title">Battlecard za konkurenco</h1>
      <p class="mt-2 text-stone-600">Kako predstaviti našo razliko, ne da bi napadali konkurenta. Vsaka kartica: njihove prednosti, naša razlika, kako odgovoriti.</p>
    </header>

    <div id="pravila"></div>
    <div id="seznam" class="space-y-4 mt-6"></div>
    <div id="intel" class="panel mt-8"></div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/app.js?v21"></script>
  <script>
    async function init() {
      const data = await loadData('konkurenca');
      if (!data) {
        document.getElementById('seznam').innerHTML =
          '<p class="text-red-700">Ne morem naložiti podatkov. Aplikacijo poženi prek lokalnega strežnika.</p>';
        return;
      }

      document.getElementById('pravila').innerHTML = `
        <div class="bg-amber-50 border border-amber-200 rounded p-4 mb-6">
          <div class="font-semibold mb-2">⚠️ Pravila uporabe</div>
          <ul class="list-disc pl-5 space-y-1 text-sm">
            ${data._pravila.map(p => `<li>${p}</li>`).join('')}
          </ul>
        </div>
      `;

      document.getElementById('seznam').innerHTML = data.konkurenti.map(k => `
        <div class="panel">
          <div class="flex items-baseline gap-3 flex-wrap mb-3">
            <h2 class="text-xl font-bold">${k.naziv}</h2>
            <span class="badge badge-stone">${k.tip}</span>
            <span class="badge badge-blue">${k.trg}</span>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
              <div class="text-xs font-semibold text-stone-500 uppercase mb-1">Njihove prednosti (spoštujemo jih)</div>
              <ul class="list-disc pl-5 space-y-1 text-sm">${k.njihove_prednosti.map(x => `<li>${x}</li>`).join('')}</ul>
            </div>
            <div>
              <div class="text-xs font-semibold text-green-800 uppercase mb-1">Naše razlike</div>
              <ul class="list-disc pl-5 space-y-1 text-sm">${k.nase_razlike.map(x => `<li>${x}</li>`).join('')}</ul>
            </div>
          </div>

          ${k.tipicni_argumenti_stranke_za_njih ? `
            <details class="mt-3">
              <summary class="cursor-pointer text-sm font-semibold text-stone-700">Tipični argumenti stranke za njih + odgovor</summary>
              <div class="mt-3 space-y-2">
                <div class="text-sm">
                  <div class="font-semibold mb-1">Kaj stranka pogosto reče:</div>
                  <ul class="list-disc pl-5 space-y-1">${k.tipicni_argumenti_stranke_za_njih.map(x => `<li>„${x}"</li>`).join('')}</ul>
                </div>
                <div class="mt-3 p-3 bg-green-50 border border-green-200 rounded text-sm">
                  <div class="font-semibold mb-1">Kako odgovoriti:</div>
                  ${k.kako_odgovoriti}
                </div>
              </div>
            </details>
          ` : ''}

          ${k.kdaj_zmagamo ? `
            <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
              <div class="p-3 bg-green-50 border border-green-200 rounded">
                <div class="text-xs font-semibold text-green-800 uppercase mb-1">Kdaj zmagamo</div>
                <ul class="list-disc pl-5">${k.kdaj_zmagamo.map(x => `<li>${x}</li>`).join('')}</ul>
              </div>
              ${k.kdaj_zgubimo ? `
                <div class="p-3 bg-red-50 border border-red-200 rounded">
                  <div class="text-xs font-semibold text-red-800 uppercase mb-1">Kdaj zgubimo (in to sprejmemo)</div>
                  <ul class="list-disc pl-5">${k.kdaj_zgubimo.map(x => `<li>${x}</li>`).join('')}</ul>
                </div>
              ` : ''}
            </div>
          ` : ''}
        </div>
      `).join('');

      document.getElementById('intel').innerHTML = `
        <h3 class="font-semibold mb-2">Kako pridobiš realen competitive intel</h3>
        <ul class="list-disc pl-5 space-y-1 text-sm">
          ${data._kako_pridobiti_intel.map(x => `<li>${x}</li>`).join('')}
        </ul>
        <p class="mt-3 text-sm text-stone-600">${data._dopolnjevanje}</p>
      `;
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
