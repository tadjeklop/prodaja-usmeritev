<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stranke — Interzero EPR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css?v22" />
  <style>
    .stranka-row { transition: background 0.1s ease; }
    .stranka-row:hover { background: #fafaf9; cursor: pointer; }
    .faza-pill { font-size: 0.7rem; padding: 0.125rem 0.5rem; border-radius: 9999px; font-weight: 600; white-space: nowrap; }
    .faza-1 { background: #e0e7ff; color: #3730a3; }
    .faza-2 { background: #dbeafe; color: #1e40af; }
    .faza-3 { background: #cffafe; color: #155e75; }
    .faza-4 { background: #ccfbf1; color: #115e59; }
    .faza-5 { background: #dcfce7; color: #166534; }
    .faza-6 { background: #fef3c7; color: #92400e; }
    .faza-7 { background: #fed7aa; color: #9a3412; }
    .faza-8 { background: #fce7f3; color: #9d174d; }
    .faza-9 { background: #e0e7ff; color: #4338ca; }
    .faza-10 { background: #d1fae5; color: #065f46; }
    .status-zmaga { color: #15803d; font-weight: 600; }
    .status-izguba { color: #b91c1c; font-weight: 600; }
    .alarm { color: #b91c1c; font-weight: 600; }
    .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: flex-start; justify-content: center; z-index: 100; padding-top: 4rem; }
    .modal { background: white; border-radius: 0.75rem; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto; padding: 2rem; }
  </style>
</head>
<body class="bg-stone-50 text-stone-900">
  <div id="app-nav"></div>

  <main class="max-w-7xl mx-auto px-6 py-10">
    <header class="mb-6 flex items-end justify-between flex-wrap gap-3">
      <div>
        <h1 class="text-3xl font-bold" data-i18n="page.stranke.title">Stranke v mojem pipelinu</h1>
        <p class="mt-2 text-stone-600" data-i18n="page.stranke.subtitle">Aktivne priložnosti — kdo, kje je v procesu, naslednji korak. Lokalno v tem brskalniku.</p>
      </div>
      <div class="flex gap-2 flex-wrap">
        <button id="btn-audit" class="btn btn-secondary" data-i18n="stranke.audit">📋 Audit log</button>
        <button id="btn-ics" class="btn btn-secondary">📅 .ics</button>
        <button id="btn-export" class="btn btn-secondary" data-i18n="common.izvozi">⬇ Izvozi</button>
        <button id="btn-import" class="btn btn-secondary" data-i18n="common.uvozi">⬆ Uvozi</button>
        <input type="file" id="import-file" accept=".json" class="hidden" />
        <button id="btn-dodaj" class="btn btn-primary" data-i18n="stranke.nova">+ Nova stranka</button>
      </div>
    </header>

    <!-- STATISTIKE -->
    <div id="stats" class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6"></div>

    <!-- FILTRI -->
    <div class="panel mb-4">
      <div class="flex items-end gap-3 flex-wrap">
        <div class="flex-1 min-w-48">
          <label class="label" data-i18n="common.iskanje">Iskanje</label>
          <input id="iskanje" class="input" placeholder="podjetje, kontakt..." data-i18n-placeholder="ph.iskaj_stranke" />
        </div>
        <div>
          <label class="label" data-i18n="stranke.faza">Faza</label>
          <select id="filter-faza" class="select"></select>
        </div>
        <div>
          <label class="label" data-i18n="stranke.segment">Segment</label>
          <select id="filter-segment" class="select"></select>
        </div>
        <div>
          <label class="label" data-i18n="stranke.status">Status</label>
          <select id="filter-status" class="select">
            <option value="aktivno" data-i18n="stranke.aktivne">Aktivne</option>
            <option value="" data-i18n="common.vse">Vse</option>
            <option value="zmaga" data-i18n="stranke.samo_zmage">Samo zmage</option>
            <option value="izguba" data-i18n="stranke.samo_izgube">Samo izgube</option>
          </select>
        </div>
      </div>
    </div>

    <!-- TABELA -->
    <div class="panel p-0 overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-stone-100 text-xs uppercase text-stone-600">
          <tr>
            <th class="text-left p-3" data-i18n="stranke.podjetje">Podjetje</th>
            <th class="text-left p-3" data-i18n="stranke.segment">Segment</th>
            <th class="text-left p-3" data-i18n="stranke.faza">Faza</th>
            <th class="text-right p-3" data-i18n="stranke.vrednost">Vrednost</th>
            <th class="text-left p-3" data-i18n="stranke.korak">Naslednji korak</th>
            <th class="text-left p-3" data-i18n="stranke.datum">Datum</th>
            <th class="text-left p-3" data-i18n="stranke.status">Status</th>
          </tr>
        </thead>
        <tbody id="seznam-body"></tbody>
      </table>
      <p id="prazno" class="hidden text-stone-600 text-center py-12" data-i18n="stranke.prazno">Še ni strank. Klikni "+ Nova stranka".</p>
    </div>

    <p class="mt-3 text-xs text-stone-500" data-i18n="stranke.alarm_hint">Stranke v rdečem imajo zapadel naslednji korak ali manjkajoč datum.</p>
  </main>

  <!-- MODAL -->
  <div id="modal" class="hidden modal-back">
    <div class="modal">
      <div class="flex justify-between items-start mb-4">
        <h2 class="text-xl font-bold" id="modal-naslov" data-i18n="stranke.nova_modal">Nova stranka</h2>
        <button id="btn-zapri" class="btn btn-ghost">✕</button>
      </div>
      <form id="forma-stranka" class="space-y-3">
        <input type="hidden" id="s-id" />
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div><label class="label"><span data-i18n="stranke.podjetje">Podjetje</span> *</label><input id="s-podjetje" class="input" required /></div>
          <div><label class="label" data-i18n="stranke.panoga">Panoga</label><select id="s-panoga" class="select"></select></div>
          <div><label class="label" data-i18n="stranke.kontakt">Kontaktna oseba</label><input id="s-kontakt" class="input" /></div>
          <div><label class="label" data-i18n="stranke.funkcija">Funkcija / vloga</label><input id="s-funkcija" class="input" /></div>
          <div><label class="label">Email</label><input id="s-email" class="input" type="email" /></div>
          <div><label class="label">Telefon</label><input id="s-tel" class="input" /></div>
          <div><label class="label"><span data-i18n="stranke.faza">Faza</span> *</label><select id="s-faza" class="select" required></select></div>
          <div><label class="label"><span data-i18n="stranke.segment">Segment</span> <a href="segmentacija.html" target="_blank" class="text-xs text-stone-500 underline">(kviz)</a></label><select id="s-segment" class="select"></select></div>
          <div><label class="label" data-i18n="stranke.status">Status</label>
            <select id="s-status" class="select">
              <option value="aktivno" data-i18n="stranke.aktivno">Aktivno</option>
              <option value="zmaga" data-i18n="stranke.zmaga">Zmaga</option>
              <option value="izguba" data-i18n="stranke.izguba">Izguba</option>
            </select>
          </div>
          <div><label class="label">Ocenjena vrednost (€/letno)</label><input id="s-vrednost" class="input" type="number" /></div>
          <div><label class="label" data-i18n="stranke.verjetnost">Verjetnost (%)</label><input id="s-verjetnost" class="input" type="number" min="0" max="100" /></div>
        </div>
        <div><label class="label" data-i18n="stranke.korak">Naslednji korak</label><input id="s-korak" class="input" placeholder="npr. Poslati ponudbo do 30. 5." /></div>
        <div><label class="label" data-i18n="stranke.datum_koraka">Datum naslednjega koraka</label><input id="s-datum" class="input" type="date" /></div>
        <div><label class="label" data-i18n="stranke.bolecine">Bolečine (ena vrstica na bolečino)</label><textarea id="s-bolecine" class="textarea" rows="3"></textarea></div>
        <div><label class="label" data-i18n="stranke.opombe">Opombe</label><textarea id="s-opombe" class="textarea" rows="3"></textarea></div>
        <div id="div-razlog" class="hidden"><label class="label" data-i18n="stranke.razlog_izgube">Razlog izgube</label>
          <select id="s-razlog" class="select">
            <option value="">—</option>
            <option value="cena">Cena</option>
            <option value="konkurenca">Izbrali konkurenta</option>
            <option value="cas">Časovni okvir</option>
            <option value="prioriteta">Druga prioriteta</option>
            <option value="vrednost">Nejasna vrednost</option>
            <option value="brez-odgovora">Brez odgovora</option>
            <option value="drugo">Drugo</option>
          </select>
        </div>

        <div class="flex justify-between gap-2 pt-3 border-t">
          <button type="button" id="btn-izbrisi" class="btn btn-ghost text-red-700 hidden" data-i18n="common.izbrisi">Izbriši</button>
          <div class="flex gap-2 ml-auto">
            <button type="button" id="btn-prekini" class="btn btn-ghost" data-i18n="common.prekini">Prekini</button>
            <button type="submit" class="btn btn-primary" data-i18n="common.shrani">Shrani</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/app.js?v22"></script>
  <script src="js/stranke.js"></script>
</body>
</html>
