<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ugovori — Interzero EPR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css?v20" />
</head>
<body class="bg-stone-50 text-stone-900">
  <div id="app-nav"></div>

  <main class="max-w-5xl mx-auto px-6 py-10">
    <header class="mb-6">
      <div class="flex items-start justify-between gap-3 flex-wrap">
        <div>
          <h1 class="text-3xl font-bold" data-i18n="page.ugovori.title">Ugovori in odgovori</h1>
          <p class="mt-2 text-stone-600" data-i18n="page.ugovori.subtitle">Iskaj po ključni besedi ali filtriraj po kategoriji. Vsak ugovor ima kratek odgovor za na sestanku in daljši za pripravo.</p>
        </div>
        <button id="btn-beri-vse" class="speech-bulk-btn no-print" data-i18n="common.beri_prikazane">🔊 Beri prikazane</button>
      </div>
    </header>

    <div class="panel mb-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="md:col-span-2">
          <label class="label" data-i18n="common.iskanje">Iskanje</label>
          <input id="iskanje" class="input" type="text" placeholder="npr. cena, ESG, lokalni..." data-i18n-placeholder="ph.ugovori" />
        </div>
        <div>
          <label class="label" data-i18n="common.kategorija">Kategorija</label>
          <select id="kategorija" class="select"></select>
        </div>
      </div>
    </div>

    <div id="seznam" class="space-y-4"></div>
    <p id="prazno" class="hidden text-stone-600 text-center py-8">Ni najdenih ugovorov za to iskanje.</p>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/app.js?v20"></script>
  <script>
    let UGOVORI = null;

    const KATEGORIJE = {
      'cena': 'Cena',
      'obstojeci-dobavitelj': 'Obstoječi dobavitelj',
      'interna-ekipa': 'Interna ekipa',
      'ni-cas': 'Nimajo časa',
      'nejasna-vrednost': 'Nejasna vrednost',
      'podatki': 'Nimajo podatkov',
      'odlocitev': 'Odločitveni proces',
      'majhno': 'Premajhno podjetje',
      'zakonodaja': 'Zakonodaja',
      'esg': 'ESG / trajnost',
      'lokalno': 'Lokalni ponudnik',
      'casovni': 'Časovni okvir',
      'pogodba': 'Vezana pogodba',
      'tveganje': 'Tveganje prehoda',
      'ne-razumem': 'Ne razumem ponudbe',
      'ddv': 'Pogodbene formalnosti',
      'lastnik': 'Lastnik / dolgoročnost',
      'kakovost': 'Skrb o kakovosti',
      'regulativna': 'Nova regulativa',
      'izgubljen-posel': 'Konkurenčne izgube',
      'razlikovanje': 'V čem ste boljši'
    };

    async function init() {
      UGOVORI = await loadData('ugovori');
      if (!UGOVORI) {
        document.getElementById('seznam').innerHTML =
          `<p class="text-red-700">${tr('common.nalaganje_error', 'Ne morem naložiti podatkov. Aplikacijo poženi prek lokalnega strežnika.')}</p>`;
        return;
      }

      renderKategorije();

      document.getElementById('iskanje').addEventListener('input', render);
      document.getElementById('kategorija').addEventListener('change', render);
      render();
    }

    function renderKategorije() {
      const sel = document.getElementById('kategorija');
      const current = sel.value;
      sel.innerHTML = `<option value="">${tr('common.vse_kategorije', 'Vse kategorije')}</option>` +
        Object.entries(KATEGORIJE).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
      sel.value = current;
    }

    function render() {
      const q = document.getElementById('iskanje').value.toLowerCase().trim();
      const cat = document.getElementById('kategorija').value;

      let items = UGOVORI.ugovori;
      if (cat) items = items.filter(u => u.kategorija === cat);
      if (q) items = items.filter(u =>
        (u.ugovor + ' ' + u.kratek_odgovor + ' ' + (u.dolgi_odgovor || '') + ' ' + (u.opomba || ''))
          .toLowerCase().includes(q)
      );

      const html = items.map((u, i) => `
        <div class="panel">
          <div class="flex items-start gap-3 flex-wrap">
            <span class="badge badge-amber">${KATEGORIJE[u.kategorija] || u.kategorija}</span>
            <div class="flex-1 min-w-0">
              <div class="font-semibold text-lg">„${u.ugovor}"</div>
              <div class="mt-3">
                <div class="text-xs font-semibold text-stone-500 uppercase mb-1">${tr('common.kratek_odgovor', 'Kratek odgovor (za na sestanku)')}</div>
                <div class="script-block" id="kratek-${i}">${u.kratek_odgovor}<button class="copy-btn" data-copy="#kratek-${i}" data-i18n="common.kopiraj">Kopiraj</button></div>
              </div>
              <details class="mt-3">
                <summary class="cursor-pointer text-sm font-semibold text-stone-700">${tr('common.daljsi_odgovor', 'Daljši odgovor in opomba')}</summary>
                <div class="mt-2 text-sm">
                  <div class="text-stone-700">${u.dolgi_odgovor || '—'}</div>
                  ${u.opomba ? `<div class="mt-3 p-3 bg-amber-50 border border-amber-200 rounded text-xs"><strong>${tr('common.opomba_prodajalcu', 'Opomba prodajalcu:')}</strong> ${u.opomba}</div>` : ''}
                </div>
              </details>
            </div>
          </div>
        </div>
      `).join('');

      document.getElementById('seznam').innerHTML = html;
      document.getElementById('prazno').classList.toggle('hidden', items.length > 0);
      wireCopyButtons();

      // Beri vse prikazane ugovore — vedno trenutni filtriran nabor
      const btn = document.getElementById('btn-beri-vse');
      if (btn) {
        btn.onclick = () => {
          if (!items.length) return;
          const seq = [];
          items.forEach(u => {
            seq.push(`Ugovor: ${u.ugovor}`);
            seq.push(`Odgovor: ${u.kratek_odgovor}`);
          });
          Speech.speakSequence(seq, { label: 'Ugovori' });
        };
      }
    }

    document.addEventListener('DOMContentLoaded', init);
    document.addEventListener('i18n:changed', () => {
      if (!UGOVORI) return;
      renderKategorije();
      render();
    });
  </script>
</body>
</html>
