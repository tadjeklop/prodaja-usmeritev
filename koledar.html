<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Koledar EPR datumov — Interzero EPR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-stone-50 text-stone-900">
  <div id="app-nav"></div>

  <main class="max-w-5xl mx-auto px-6 py-10">
    <header class="mb-6">
      <h1 class="text-3xl font-bold" data-i18n="page.koledar.title">Koledar EPR datumov</h1>
      <p class="mt-2 text-stone-600">Letni cikel obveznosti in priložnosti za prodajo. Vedi, kdaj stranka misli na kaj.</p>
    </header>

    <div id="trenutni-mesec" class="mb-6"></div>

    <h2 class="text-lg font-semibold mb-4">Letni cikel</h2>
    <div id="cikel" class="space-y-3 mb-10"></div>

    <h2 class="text-lg font-semibold mb-4">Večletni horizont (regulativa)</h2>
    <div id="horizont" class="space-y-3"></div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function init() {
      const data = await loadData('koledar');
      if (!data) {
        document.getElementById('cikel').innerHTML =
          '<p class="text-red-700">Ne morem naložiti podatkov.</p>';
        return;
      }

      const trenutni = new Date().getMonth() + 1;
      const tm = data.letni_cikel.find(m => m.mesec === trenutni);
      if (tm) {
        document.getElementById('trenutni-mesec').innerHTML = `
          <div class="panel bg-green-50 border-green-200">
            <div class="text-xs font-semibold uppercase text-green-800 mb-1">Trenutni mesec</div>
            <h2 class="text-xl font-bold mb-3">${tm.naziv}</h2>
            ${tm.dogodki.map(d => renderDogodek(d)).join('')}
          </div>
        `;
      }

      document.getElementById('cikel').innerHTML = data.letni_cikel.map(m => `
        <details class="panel" ${m.mesec === trenutni ? 'open' : ''}>
          <summary class="cursor-pointer">
            <span class="font-semibold">${m.mesec}. ${m.naziv}</span>
            <span class="text-sm text-stone-600 ml-2">${m.dogodki.length} ${m.dogodki.length === 1 ? 'dogodek' : 'dogodki'}</span>
          </summary>
          <div class="mt-3 space-y-3">
            ${m.dogodki.map(d => renderDogodek(d)).join('')}
          </div>
        </details>
      `).join('');

      document.getElementById('horizont').innerHTML = data.vecletni_horizont.map(h => `
        <div class="panel">
          <div class="flex items-baseline gap-2 flex-wrap mb-2">
            <span class="badge badge-blue">${h.datum}</span>
            <h3 class="font-semibold">${h.naslov}</h3>
          </div>
          <p class="text-sm mb-2">${h.kaj}</p>
          <p class="text-sm text-stone-700"><strong>Vpliv na stranke:</strong> ${h.vpliv_na_stranke}</p>
        </div>
      `).join('');
    }

    function renderDogodek(d) {
      const kriticno = d.kritisticnost === 'visoka';
      return `
        <div class="p-3 rounded border ${kriticno ? 'bg-red-50 border-red-200' : 'bg-stone-50 border-stone-200'}">
          <div class="flex items-baseline gap-2 flex-wrap mb-1">
            <span class="badge ${kriticno ? 'badge-amber' : 'badge-stone'}">${d.rok}</span>
            <span class="font-semibold">${d.naslov}</span>
          </div>
          <div class="text-xs text-stone-500 mb-1">${d.kdo}</div>
          <div class="text-sm mb-2">${d.kaj}</div>
          ${d.interzero_vloga ? `<div class="text-sm bg-white p-2 rounded border-l-2 border-green-500"><strong>Interzero vloga:</strong> ${d.interzero_vloga}</div>` : ''}
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
